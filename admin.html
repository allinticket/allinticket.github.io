<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALLIN·TICKET Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d11;--p:#17171e;--p2:#22222b;--line:#343440;--txt:#f5f3f8;--muted:#aaa5b4;--lav:#b9a4e8;--red:#e88b9a;--green:#91c9ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--lav);color:#17131f;font-weight:650;cursor:pointer}button.secondary{background:var(--p2);color:var(--txt);border:1px solid var(--line)}button.danger{background:#49242c;color:#ffdce2}input,select{width:100%;background:#101016;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt)}label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}.wrap{max-width:1050px;margin:auto;padding:22px 16px 55px}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand strong{letter-spacing:2px;font-size:19px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:3px;margin-top:5px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}h1{font-size:25px;margin:0 0 7px}h2{font-size:17px;margin:0 0 15px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px;line-height:1.6}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:18px 0}.tab{background:var(--p2);color:var(--muted);border:1px solid var(--line)}.tab.active{background:var(--lav);color:#17131f}.hidden{display:none!important}.list{display:grid;gap:9px}.item{background:#111118;border:1px solid var(--line);border-radius:12px;padding:12px}.pill{background:#30283f;color:#d9c9ff;border-radius:30px;padding:4px 9px;font-size:11px}.file{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.file:last-child{border:0}.notice{background:#252132;color:#d8c9f5;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}a{color:var(--lav)}#msg{color:var(--green);white-space:pre-wrap;margin:10px 0}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:14px}}
</style></head><body><main class="wrap">
<header class="brand"><div><strong>ALLIN·TICKET</strong><small>ADMINISTRATION / V2.1</small></div><span class="pill">PRIVATE ADMIN</span></header>
<section id="login" class="card"><h1>管理员登录</h1><p class="muted">连接你的 Supabase 项目，管理团体、演出与余票文件。</p>
<div class="field"><label>Supabase Project URL</label><input id="url" placeholder="https://你的项目ID.supabase.co"></div>
<div class="field"><label>Publishable Key（不是 Secret Key）</label><input id="key" placeholder="sb_publishable_..."></div>
<div class="grid"><div class="field"><label>管理员邮箱</label><input id="email" type="email"></div><div class="field"><label>密码</label><input id="password" type="password"></div></div><button id="loginBtn">登录后台</button><div id="loginMsg" class="tiny"></div></section>
<section id="app" class="hidden"><div class="row"><div><h1>管理中心</h1><div id="who" class="tiny muted"></div></div><button id="logoutBtn" class="secondary">退出登录</button></div>
<div class="tabs"><button class="tab active" data-tab="artists">团体管理</button><button class="tab" data-tab="cities">城市管理</button><button class="tab" data-tab="events">演出管理</button><button class="tab" data-tab="files">余票更新</button></div><div id="msg"></div>
<section id="artists" class="tabPane card"><div class="row"><h2>艺人 / 团体</h2><span id="artistCount" class="pill">0 个</span></div><div class="grid"><div class="field"><label>新增团体名称</label><input id="artistName" placeholder="例如：CORTIS / SEVENTEEN"></div><div class="field" style="align-self:end"><button id="addArtist">新增团体</button></div></div><div id="artistList" class="list"></div></section>
<section id="cities" class="tabPane card hidden"><h2>新增城市</h2><div class="grid"><div class="field"><label>所属团体</label><select id="cityArtist"></select></div><div class="field"><label>城市名称</label><input id="cityName" placeholder="例如：首尔 / 釜山 / 东京"></div><div class="field" style="align-self:end"><button id="addCity">新增城市</button></div></div><div class="notice">城市归属于具体团体。同一个团体可以有多个巡演城市；不同团体可以分别建立自己的城市列表。</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>城市列表</h2><div id="cityList" class="list"></div></section>
<section id="events" class="tabPane card hidden"><h2>新增演出</h2><div class="grid"><div class="field"><label>所属团体</label><select id="eventArtist"></select></div><div class="field"><label>所属城市</label><select id="eventCity"></select></div><div class="field"><label>演出名称</label><input id="eventTitle" placeholder="例如：WORLD TOUR"></div><div class="field"><label>演出日期（可不填）</label><input id="eventDate" type="date"></div><div class="field" style="align-self:end"><button id="addEvent">新增演出</button></div></div><div class="notice">新建演出默认发布，粉丝端可查询。旧版演出数据保留不动。</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>演出列表</h2><div id="eventList" class="list"></div></section>
<section id="files" class="tabPane card hidden"><h2>余票更新</h2><div class="grid"><div class="field"><label>选择团体</label><select id="fileArtist"></select></div><div class="field"><label>选择演出</label><select id="fileEvent"></select></div></div><div class="field"><label>上传余票文件（可多选，单个文件最大 50MB）</label><input id="uploadInput" type="file" multiple></div><button id="uploadBtn">上传文件</button><p class="tiny">支持图片、PDF、Excel、Word 等。上传新版本后可删除旧文件；删除会永久清理云端文件。</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>已上传内容</h2><div id="fileList" class="list tiny muted">请选择演出查看文件</div></section></section></main>
<script>
const $=id=>document.getElementById(id);let sb,artists=[],cities=[],events=[],files=[];
function say(t){$('msg').textContent=t||''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function bytes(n){return !n?'':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB'}
async function login(){ $('loginMsg').textContent='正在连接…';try{let url=$('url').value.trim().replace(/\/$/,''),key=$('key').value.trim();if(!url||!key)throw Error('请填写 Project URL 和 Publishable Key');sb=window.supabase.createClient(url,key);let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;let {data:ok,error:re}=await sb.rpc('is_allin_admin');if(re)throw re;if(!ok)throw Error('当前账号没有管理员权限，请检查 admin_users');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=data.user.email;await loadAll()}catch(e){$('loginMsg').textContent='登录失败：'+e.message}}
async function loadAll(){let a=await sb.from('artist_groups').select('*').order('name');if(a.error)throw a.error;artists=a.data||[];let c=await sb.from('artist_cities').select('*').order('name');if(c.error)throw c.error;cities=c.data||[];let e=await sb.from('events').select('id,title,artist,artist_group_id,city_id,event_date,created_at').order('created_at',{ascending:false});if(e.error)throw e.error;events=e.data||[];renderArtists();fillSelects();renderCities();renderEvents();await loadFiles()}
function renderArtists(){$('artistCount').textContent=artists.length+' 个';$('artistList').innerHTML=artists.map(a=>`<div class="item row"><div><b>${esc(a.name)}</b><div class="tiny">${events.filter(e=>e.artist_group_id===a.id).length} 场演出</div></div><div class="actions"><button class="secondary" onclick="renameArtist('${a.id}')">改名</button><button class="danger" onclick="deleteArtist('${a.id}')">删除</button></div></div>`).join('')||'<div class="tiny">还没有团体，请先新增。</div>'}
function fillSelects(){let opts=artists.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');$('eventArtist').innerHTML=opts||'<option value="">请先新增团体</option>';$('fileArtist').innerHTML=opts||'<option value="">请先新增团体</option>';$('cityArtist').innerHTML=opts||'<option value="">请先新增团体</option>';fillCitySelect();fillEventSelect()}
function fillCitySelect(){let aid=$('eventArtist').value,rows=cities.filter(c=>c.artist_group_id===aid);$('eventCity').innerHTML='<option value="">暂不指定城市</option>'+rows.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function renderCities(){let aid=$('cityArtist').value||artists[0]?.id; if(aid && !$('cityArtist').value)$('cityArtist').value=aid;let rows=cities.filter(c=>c.artist_group_id===aid);$('cityList').innerHTML=rows.map(c=>{let n=events.filter(e=>e.city_id===c.id).length;return `<div class="item row"><div><b>${esc(c.name)}</b><div class="tiny">${n} 场演出</div></div><div class="actions"><button class="secondary" onclick="renameCity('${c.id}')">改名</button><button class="danger" onclick="deleteCity('${c.id}')">删除</button></div></div>`}).join('')||'<div class="tiny">这个团体还没有城市，请先新增。</div>'}
function fillEventSelect(){let aid=$('fileArtist').value;$('fileEvent').innerHTML=events.filter(e=>e.artist_group_id===aid).map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')||'<option value="">该团体暂无演出</option>'}
function renderEvents(){$('eventList').innerHTML=events.map(e=>{let a=artists.find(x=>x.id===e.artist_group_id),c=cities.find(x=>x.id===e.city_id);return `<div class="item row"><div><b>${esc(e.title)}</b><div class="tiny">${esc(a?.name||'未关联团体')} · ${esc(c?.name||'未指定城市')} · ${esc(e.event_date||'日期未填写')}</div></div><button class="danger" onclick="deleteEvent('${e.id}')">删除演出</button></div>`}).join('')||'<div class="tiny">暂无演出。</div>'}
async function loadFiles(){let eid=$('fileEvent').value;if(!eid){$('fileList').innerHTML='请选择一个有演出的团体';return}let r=await sb.from('event_files').select('*').eq('event_id',eid).order('created_at',{ascending:false});if(r.error){$('fileList').textContent='读取失败：'+r.error.message;return}files=r.data||[];$('fileList').innerHTML=files.map(f=>{let {data}=sb.storage.from('ticket-files').getPublicUrl(f.storage_path);return `<div class="file"><div><b>${esc(f.file_name)}</b><div class="tiny">${bytes(f.file_size)} · ${new Date(f.created_at).toLocaleString()}</div><a href="${data.publicUrl}" target="_blank" rel="noopener">打开 / 预览</a></div><button class="danger" onclick="deleteFile('${f.id}')">永久删除</button></div>`}).join('')||'<div class="tiny">这场演出还没有上传余票文件。</div>'}
async function refresh(){await loadAll()}
$('loginBtn').onclick=login;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tabPane').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.tab))});
$('addArtist').onclick=async()=>{let name=$('artistName').value.trim();if(!name)return say('请填写团体名称');let r=await sb.from('artist_groups').insert({name});if(r.error)return say('新增失败：'+r.error.message);$('artistName').value='';await refresh();say('团体已新增')};
window.renameArtist=async id=>{let a=artists.find(x=>x.id===id),name=prompt('请输入新的团体名称',a.name);if(!name?.trim())return;let r=await sb.from('artist_groups').update({name:name.trim()}).eq('id',id);if(r.error)return say('修改失败：'+r.error.message);await refresh();say('团体名称已修改')};
window.deleteArtist=async id=>{let a=artists.find(x=>x.id===id);if(events.some(e=>e.artist_group_id===id))return alert('该团体下面还有演出，请先删除演出。');if(!confirm('确定永久删除团体「'+a.name+'」？'))return;let r=await sb.from('artist_groups').delete().eq('id',id);if(r.error)return say('删除失败：'+r.error.message);await refresh();say('团体已删除')};
$('addEvent').onclick=async()=>{let aid=$('eventArtist').value,g=artists.find(a=>a.id===aid),title=$('eventTitle').value.trim(),cityId=$('eventCity').value||null;if(!g)return say('请先新增团体');if(!title)return say('请填写演出名称');let p={title,artist:g.name,artist_group_id:aid,city_id:cityId,status:'published'};if($('eventDate').value)p.event_date=$('eventDate').value;let r=await sb.from('events').insert(p);if(r.error)return say('新增失败：'+r.error.message);$('eventTitle').value='';$('eventDate').value='';await refresh();say('演出已新增')};
$('addCity').onclick=async()=>{let aid=$('cityArtist').value,name=$('cityName').value.trim();if(!aid)return say('请先选择团体');if(!name)return say('请填写城市名称');let r=await sb.from('artist_cities').insert({artist_group_id:aid,name});if(r.error)return say('新增城市失败：'+r.error.message);$('cityName').value='';await refresh();$('cityArtist').value=aid;renderCities();say('城市已新增')};
$('cityArtist').onchange=renderCities;$('eventArtist').onchange=fillCitySelect;
window.renameCity=async id=>{let c=cities.find(x=>x.id===id),name=prompt('请输入新的城市名称',c.name);if(!name?.trim())return;let r=await sb.from('artist_cities').update({name:name.trim()}).eq('id',id);if(r.error)return say('修改城市失败：'+r.error.message);await refresh();say('城市名称已修改')};
window.deleteCity=async id=>{let c=cities.find(x=>x.id===id);if(events.some(e=>e.city_id===id))return alert('该城市下面还有演出，请先调整或删除相关演出。');if(!confirm('确定删除城市「'+c.name+'」？'))return;let r=await sb.from('artist_cities').delete().eq('id',id);if(r.error)return say('删除城市失败：'+r.error.message);await refresh();say('城市已删除')};
window.deleteEvent=async id=>{let e=events.find(x=>x.id===id);if(!confirm('确定删除「'+e.title+'」及其全部余票文件？此操作不可恢复。'))return;let fr=await sb.from('event_files').select('storage_path').eq('event_id',id);if(fr.error)return say('读取文件失败，未删除演出：'+fr.error.message);let paths=(fr.data||[]).map(x=>x.storage_path);if(paths.length){let sr=await sb.storage.from('ticket-files').remove(paths);if(sr.error)return say('云端文件删除失败，演出未删除：'+sr.error.message)}let dr=await sb.from('event_files').delete().eq('event_id',id);if(dr.error)return say('云端文件已删除，但记录清理失败：'+dr.error.message);let er=await sb.from('events').delete().eq('id',id);if(er.error)return say('文件已清理，但演出删除失败：'+er.error.message);await refresh();say('演出及文件已永久删除')};
$('fileArtist').onchange=()=>{fillEventSelect();loadFiles()};$('fileEvent').onchange=loadFiles;
$('uploadBtn').onclick=async()=>{let eid=$('fileEvent').value,chosen=[...$('uploadInput').files];if(!eid)return say('请先选择演出');if(!chosen.length)return say('请先选择文件');for(let f of chosen)if(f.size>50*1024*1024)return say('文件「'+f.name+'」超过 50MB，请压缩后上传');$('uploadBtn').disabled=true;say('正在上传…');try{for(let f of chosen){let safe=f.name.replace(/[^\w.\\-\\u4e00-\\u9fa5]/g,'_'),path=eid+'/'+Date.now()+'_'+crypto.randomUUID()+'_'+safe;let up=await sb.storage.from('ticket-files').upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(up.error)throw up.error;let ins=await sb.from('event_files').insert({event_id:eid,file_name:f.name,mime_type:f.type||null,file_size:f.size,storage_path:path});if(ins.error){await sb.storage.from('ticket-files').remove([path]);throw ins.error}}$('uploadInput').value='';await loadFiles();say('上传完成')}catch(e){say('上传中断：'+e.message+'。已成功上传的文件会保留，请检查列表。')}finally{$('uploadBtn').disabled=false}};
window.deleteFile=async id=>{let f=files.find(x=>x.id===id);if(!confirm('确定永久删除文件「'+f.file_name+'」？'))return;let sr=await sb.storage.from('ticket-files').remove([f.storage_path]);if(sr.error)return say('云端文件删除失败，记录保留：'+sr.error.message);let dr=await sb.from('event_files').delete().eq('id',id);if(dr.error)return say('云端文件已删除，但数据库记录清理失败：'+dr.error.message);await loadFiles();say('文件已永久删除并释放存储空间')};
</script></body></html>
